env_file: .env

paths:
  appids_csv: data/input/appids.csv
  raw_dir: data/raw
  logs_dir: data/logs
  reviews_raw_parquet: data/raw/reviews_raw.parquet
  review_summary_parquet: data/raw/review_summary_by_app.parquet
  app_metadata_parquet: data/raw/app_metadata.parquet
  failed_appids_csv: data/logs/failed_appids.csv

crawler:
  review_endpoint: https://store.steampowered.com/appreviews/{appid}
  language: koreana
  filter: recent
  review_type: all
  purchase_type: all
  num_per_page: 100
  filter_offtopic_activity: 1
  max_reviews_per_app: 150
  final_reviews_per_app: 100
  max_failures: 3
  sleep_sec: 1.0
  timeout_sec: 20
  user_agent: steam-review-crawler/0.1 (academic data science project)
  retry:
    max_attempts: 5
    backoff_initial_sec: 1.0
    backoff_multiplier: 2.0
    backoff_max_sec: 30.0
    jitter_sec: 0.25
    status_forcelist: [429, 500, 502, 503, 504]

overall_rating:
  enabled: true
  filter: all
  language: all
  review_type: all
  purchase_type: all
  num_per_page: 0
  cursor: "*"
  filter_offtopic_activity: 1
  timeout_sec: 20
  retry:
    max_attempts: 5
    backoff_initial_sec: 1.0
    backoff_multiplier: 2.0
    backoff_max_sec: 30.0
    jitter_sec: 0.25
    status_forcelist: [429, 500, 502, 503, 504]

test_mode:
  max_reviews_per_app: 200

metadata:
  enabled: true
  appdetails_endpoint: https://store.steampowered.com/api/appdetails
  cc: kr
  language: korean
  sleep_sec: 0.5
  timeout_sec: 20
  retry:
    max_attempts: 3
    backoff_initial_sec: 1.0
    backoff_multiplier: 2.0
    backoff_max_sec: 10.0
    jitter_sec: 0.25
    status_forcelist: [429, 500, 502, 503, 504]

app_list:
  endpoint: https://api.steampowered.com/ISteamApps/GetAppList/v2/
  timeout_sec: 30
  retry:
    max_attempts: 3
    backoff_initial_sec: 1.0
    backoff_multiplier: 2.0
    backoff_max_sec: 20.0
    jitter_sec: 0.25
    status_forcelist: [429, 500, 502, 503, 504]

selection:
  target_count: 300
  strategy_tag_id: null
  games_category_id: 998
  max_search_results: 3000
  search_page_size: 100
  sort_by: Reviews_DESC
  sort_by_list: [Reviews_ASC, Reviews_DESC, _ASC]
  min_global_reviews: 300
  min_korean_reviews: 500
  bin_mode: steam_score
  rating_bin_width: 10
  max_candidates_per_bin_check: 600
  allow_bin_redistribution: true
  quota_over_active_bins: true
  require_target_count: true
  sleep_sec: 0.15
  search_sleep_sec: 1.5
  rate_limit_sleep_sec: 45.0
  search_timeout_sec: 30
  review_timeout_sec: 20
  output_appids_csv: data/input/appids.csv
  candidates_csv: data/logs/strategy_candidates.csv
  selected_csv: data/logs/strategy_selected_games.csv
  backup_existing_appids: true

output:
  save_csv: true
  save_parquet: true
  privacy_hash_salt_env: STEAM_REVIEW_HASH_SALT
  hash_salt: ""
